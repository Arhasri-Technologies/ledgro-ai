*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  background:
    radial-gradient(120% 90% at 50% 0%,#1a1a1c 0%,#0d0d0e 55%,#08080a 100%);
  display:flex;align-items:center;justify-content:center;
  font-family:Arimo,Arial,'Helvetica Neue',sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased;
  cursor:default;
}

/* ================= scene ================= */
.fit{transform:scale(var(--fit,1));transform-origin:50% 50%}
.scene{position:relative;width:364px;height:var(--sh,742px);perspective:1200px;perspective-origin:50% 50%}
.cord{position:absolute;left:calc(-1 * var(--ox,0px));top:calc(-1 * var(--oy,60px));pointer-events:none}
.rig{
  position:absolute;left:0;top:var(--rigtop,202px);width:364px;height:540px;
  transform-origin:50% 50%;
}

/* ================= crimp ================= */
.clip{position:absolute;left:50%;top:-16px;width:74px;height:34px;margin-left:-37px}
.clip .barrel{
  position:absolute;left:0;top:0;width:74px;height:15px;border-radius:3px;
  background:linear-gradient(180deg,#d8dde4 0%,#959ca7 30%,#5b626c 58%,#848c96 78%,#343940 100%);
  box-shadow:0 1px 2px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.65);

<body>
<div class="fit" id="fit">

<script>
(function(){
'use strict';
var PW=364,PH=540,          /* sleeve */
    BX=12,BY=58,BW=340,BH=470;  /* card inside the sleeve */

var fit=document.getElementById('fit'),rig=document.getElementById('rig'),
    scene=document.querySelector('.scene'),
    holder=document.getElementById('holder'),
    faceCv=document.getElementById('face'),cordCv=document.getElementById('cord');

/* =====================================================================
   barcode
   ===================================================================== */
var barcodeCv=document.createElement('canvas');
barcodeCv.width=412;barcodeCv.height=68;
(function(){
  var c=barcodeCv,g=c.getContext('2d'),s=20250726,x=0;
  function rnd(){s=(s*1664525+1013904223)&0x7fffffff;return s/0x7fffffff}

    var w=1+Math.floor(rnd()*5)*2;

})();

/* =====================================================================
   heat field  (deposit -> exponential cooling -> colour ramp)
   ===================================================================== */
var RAMP=[[19,19,22],[18,19,25],[17,20,42],[18,23,58],[19,25,72],[22,31,93],[24,34,113],
  [28,44,134],[31,51,148],[37,61,169],[45,76,192],[55,97,209],[68,125,224],[88,158,230],
  [116,190,230],[147,211,212],[178,223,185],[210,224,153],[230,219,130],[244,210,105],
  [247,198,94],[245,188,80],[246,176,68],[240,130,58],[240,102,39],[237,65,26]];
var RS=[0],tot=0,i;

  tot+=Math.hypot(RAMP[i][0]-RAMP[i-1][0],RAMP[i][1]-RAMP[i-1][1],RAMP[i][2]-RAMP[i-1][2]);
  RS.push(tot);
}
for(i=0;i<RS.length;i++)RS[i]/=tot;
/* ramp position after n half-seconds of cooling */
var SEQ=[1,0.8752,0.7214,0.5484,0.4332,0.338,0.2792,0.2394,0.2055,0.1806,0.1606,
  0.1406,0.1192,0.0982,0.0806,0.0665,0.0554,0.047,0.0403,0.0343,0.0289,0.025];
var TAU=4.33,SIGMA=48,GAIN=0.95,REACH=3*SIGMA;

  if(s<=0)return RAMP[0];

var LN=512,LUT=new Uint8ClampedArray(LN*4);
(function(){
  /* the ramp was sampled over a #161616 card; screen-blending needs the light it adds */

  for(n=SEQ.length-1;n>=0;n--)ITOS.push([Math.pow(k,n),SEQ[n]]);

    while(j<ITOS.length-1&&ITOS[j][0]<I)j++;

    s=ITOS[j-1][1]+(ITOS[j][1]-ITOS[j-1][1])*f;

    LUT[n*4+1]=Math.max(0,(c[1]-base)/(1-base/255));

var CELL=2,GW=Math.ceil(BW/CELL),GH=Math.ceil(BH/CELL),field=new Float32Array(GW*GH);
var hbuf=document.createElement('canvas');hbuf.width=GW;hbuf.height=GH;

    for(gx=x0;gx<=x1;gx++){
      dx=(gx+0.5)*CELL-x;r2=dx*dx+dy*dy;

var heatLive=true;
function paintHeat(){
  var n=GW*GH,p,v,li,mx=0;
  for(p=0;p<n;p++){
    v=field[p];if(v>mx)mx=v;if(v>1)v=1;

/* =====================================================================
   vinyl sleeve — procedural crinkle normals lit per frame
   ===================================================================== */
var GS=2,                                  /* gloss buffer scale */
    LW=Math.ceil(PW/GS),LH=Math.ceil(PH/GS),
    NX=new Float32Array(LW*LH),NY=new Float32Array(LW*LH),NZ=new Float32Array(LW*LH),
    ROUGH=new Float32Array(LW*LH);         /* per-pixel roughness (welds are matte) */

(function buildSurface(){
  var seed=1337;
  function rnd(){seed=(seed*1664525+1013904223)&0x7fffffff;return seed/0x7fffffff}

  /* --- slack in the sheet: a couple of very soft octaves --- */
  function octave(cols,rows,amp){
    var g=new Float32Array((cols+1)*(rows+1)),j;
    for(j=0;j<g.length;j++)g[j]=rnd()-0.5;
    for(y=0;y<LH;y++){
      var fy=y/LH*rows,iy=Math.floor(fy),ty=fy-iy;ty=ty*ty*(3-2*ty);
      for(x=0;x<LW;x++){
        var fx=x/LW*cols,ix=Math.floor(fx),tx=fx-ix;tx=tx*tx*(3-2*tx);
        var a=g[iy*(cols+1)+ix],b=g[iy*(cols+1)+ix+1],
            c=g[(iy+1)*(cols+1)+ix],d=g[(iy+1)*(cols+1)+ix+1],
            t1=a+(b-a)*tx,t2=c+(d-c)*tx;

  octave(2,3,1.0);octave(4,6,0.45);octave(8,12,0.16);octave(14,21,0.05);

  /* --- folds: long soft ridges from being handled --- */
  var cr=[[0.10,-0.06,0.72,1.05, 0.85,16],[0.86,-0.03,0.28,1.06,-0.62,13],
          [-0.06,0.26,1.06,0.46, 0.50,20],[0.42,1.05,0.94,0.18,-0.40,15],
          [0.62,-0.04,0.34,0.55, 0.30,11]];
  for(var ci=0;ci<cr.length;ci++){
    var ax=cr[ci][0]*LW,ay=cr[ci][1]*LH,bx=cr[ci][2]*LW,by=cr[ci][3]*LH,
        amp=cr[ci][4],wid=cr[ci][5],vx=bx-ax,vy=by-ay,len2=vx*vx+vy*vy;
    for(y=0;y<LH;y++)for(x=0;x<LW;x++){
      var t=((x-ax)*vx+(y-ay)*vy)/len2;t=t<0?0:t>1?1:t;
      var dx=x-(ax+vx*t),dy=y-(ay+vy*t),d2=dx*dx+dy*dy;

  /* --- long shallow ripples: the sheet is never perfectly flat --- */
  var k1=2*Math.PI/(88/GS),k2=2*Math.PI/(146/GS),k3=2*Math.PI/(59/GS);
  for(y=0;y<LH;y++)for(x=0;x<LW;x++){
    h[y*LW+x]+= 0.30*Math.sin((x*0.92+y*0.39)*k1+1.1)
              + 0.22*Math.sin((x*-0.36+y*0.93)*k2+2.7)
              + 0.10*Math.sin((x*0.72-y*0.69)*k3+0.4);
  }

  /* --- air trapped between the sheet and the card --- */
  var bub=[[0.30,0.34,9,0.55],[0.71,0.55,6.5,0.42],[0.52,0.80,12,0.5],[0.22,0.68,5,0.3]];
  for(var bi=0;bi<bub.length;bi++){
    var bx=bub[bi][0]*LW,by=bub[bi][1]*LH,br=bub[bi][2],ba=bub[bi][3];
    for(y=0;y<LH;y++)for(x=0;x<LW;x++){
      var dx=x-bx,dy=y-by,d2=(dx*dx+dy*dy)/(br*br);
      if(d2<9)h[y*LW+x]+=ba*(1-d2*0.55)*Math.exp(-d2*0.5);
    }
  }

  /* --- welded rim: a rounded bevel all the way around the sleeve --- */
  for(y=0;y<LH;y++)for(x=0;x<LW;x++){
    o=y*LW+x;
    var e=Math.min(x,y,LW-1-x,LH-1-y)*GS,
        bevel=Math.exp(-Math.pow((e-7)/5.5,2))*1.15 - Math.exp(-Math.pow((e-15)/7,2))*0.35;
    h[o]+=bevel;
    ROUGH[o]=Math.exp(-e/11);            /* the weld is frosted */
  }

  /* --- fingerprints: local haze that kills the mirror --- */
  var smu=[[0.22,0.22,26],[0.78,0.40,20],[0.46,0.90,30],[0.66,0.72,17]];
  for(var si=0;si<smu.length;si++){
    var mx=smu[si][0]*LW,my=smu[si][1]*LH,mr=smu[si][2]/GS;
    for(y=0;y<LH;y++)for(x=0;x<LW;x++){
      var dx=x-mx,dy=y-my,d2=(dx*dx+dy*dy)/(mr*mr);
      if(d2<9){

  for(y=0;y<LH;y++)for(x=0;x<LW;x++){
    var px=x*GS,py=y*GS,
        inx=Math.min(px-BX,BX+BW-px),iny=Math.min(py-BY,BY+BH-py),

  var S=0.95;
  for(y=0;y<LH;y++)for(x=0;x<LW;x++){

        hy=h[Math.min(LH-1,y+1)*LW+x]-h[Math.max(0,y-1)*LW+x],

  }
})();

var gbuf=document.createElement('canvas');gbuf.width=LW;gbuf.height=LH;
var gctx=gbuf.getContext('2d'),gimg=gctx.createImageData(LW,LH),gdata=gimg.data;

/* three studio lights, in scene space */
var LIGHTS=[
  {d:[-0.42,-0.78,0.47],c:[1.00,0.96,0.90],k:1.70,tight:1},   /* key, upper left  */
  {d:[ 0.66,-0.30,0.69],c:[0.55,0.68,1.00],k:0.60,tight:1},   /* cool fill, right */
  {d:[ 0.05, 0.86,0.51],c:[1.00,0.78,0.55],k:0.34,tight:0}    /* warm bounce      */
];
for(i=0;i<LIGHTS.length;i++){
  var d=LIGHTS[i].d,l=Math.hypot(d[0],d[1],d[2]);
  d[0]/=l;d[1]/=l;d[2]/=l;
}

function paintGloss(rx,ry,rz){
  /* rotate the scene lights into the sleeve's own frame (R = Rx·Ry, so use Rᵀ) */
  var ax=rx*Math.PI/180,ay=ry*Math.PI/180,
      ca=Math.cos(ax),sa=Math.sin(ax),cb=Math.cos(ay),sb=Math.sin(ay);
  var m00=cb, m01=sb*sa, m02=-sb*ca,
      m10=0,  m11=ca,    m12=sa,
      m20=sb, m21=-cb*sa,m22=cb*ca;
  var cz=Math.cos(-rz||0),sz=Math.sin(-rz||0);
  function toLocal(v){
    /* undo the swing first, then the lean */
    var x0=v[0]*cz-v[1]*sz,y0=v[0]*sz+v[1]*cz,z0=v[2];
    return [m00*x0+m01*y0+m02*z0,
            m10*x0+m11*y0+m12*z0,
            m20*x0+m21*y0+m22*z0];
  }
  var L=[],j;
  for(j=0;j<LIGHTS.length;j++)
    L.push({d:toLocal(LIGHTS[j].d),c:LIGHTS[j].c,k:LIGHTS[j].k,t:LIGHTS[j].tight});

  var cam=toLocal([0,-PH*0.10,1150]),
      camx=cam[0]+PW*0.5,camy=cam[1]+PH*0.5,camz=cam[2];
  /* two soft windows above the scene, reflected in the sheet */
  var envd=toLocal([-0.30,-0.86,0.41]),
      envd2=toLocal([0.62,-0.42,0.66]);

  var x,y,o,p=0;
  for(y=0;y<LH;y++){
    var py=(y+0.5)*GS;
    for(x=0;x<LW;x++,p+=4){
      o=y*LW+x;
      var px=(x+0.5)*GS,
          nx=NX[o],ny=NY[o],nz=NZ[o],
          vx=camx-px,vy=camy-py,vz=camz,
          vl=1/Math.sqrt(vx*vx+vy*vy+vz*vz);
      vx*=vl;vy*=vl;vz*=vl;
      var ndv=nx*vx+ny*vy+nz*vz;if(ndv<0)ndv=0;
      var rough=ROUGH[o],r=0,g=0,b=0;

      for(j=0;j<L.length;j++){
        var ld=L[j].d,
            hx=ld[0]+vx,hy=ld[1]+vy,hz=ld[2]+vz,
            hl=1/Math.sqrt(hx*hx+hy*hy+hz*hz),
            ndh=(nx*hx+ny*hy+nz*hz)*hl;
        if(ndh<=0)continue;
        var ndl=nx*ld[0]+ny*ld[1]+nz*ld[2];if(ndl<0)ndl=0;
        var s2=ndh*ndh,s4=s2*s2,s8=s4*s4,s16=s8*s8,s32=s16*s16,s64=s32*s32,s128=s64*s64,
            sharp=L[j].t?s128*(1-rough*0.75)+s32*0.10:s32*0.06,
            frost=rough*ndl*0.06;

        r+=amt*L[j].c[0];g+=amt*L[j].c[1];b+=amt*L[j].c[2];

          ed=ex*envd[0]+ey*envd[1]+ez*envd[2],
          ed2=ex*envd2[0]+ey*envd2[1]+ez*envd2[2];
      if(ed<0)ed=0;if(ed2<0)ed2=0;
      var a2=ed*ed,a4=a2*a2,a8=a4*a4,a16=a8*a8,
          b2=ed2*ed2,b4=b2*b2,b8=b4*b4,

      b+=env*1.00+env2*1.00;

      gdata[p  ]=255-255*Math.exp(-r/210);

}



/* =====================================================================
   the printed card, the heat and the sleeve are composited inside one
   canvas: no DOM blend layers, so nothing can tear while it swings
   ===================================================================== */
var fctx=faceCv.getContext('2d'),
    printCv=document.createElement('canvas'),
    nameCv=document.createElement('canvas'),

function track(g,str,x,y,tr,align){
  var i,w=0,cx;
  for(i=0;i<str.length;i++)w+=g.measureText(str[i]).width+tr;
  w-=tr;
  cx=align==='right'?x-w:x;
  for(i=0;i<str.length;i++){g.fillText(str[i],cx,y);cx+=g.measureText(str[i]).width+tr;}
  return w;
}
/* css line-height:1 puts the baseline here */
function baseAt(g,top,size){
  var m=g.measureText('H');
  var asc=m.fontBoundingBoxAscent,desc=m.fontBoundingBoxDescent;
  return top+(size-(asc+desc))/2+asc;
}
function roundRect(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);
  g.closePath();
}

function buildPrint(){
  var d=dpr||1;
  printCv.width=Math.round(PW*d);printCv.height=Math.round(PH*d);
  nameCv.width=Math.round(PW*d);nameCv.height=Math.round(PH*d);
  var g=printCv.getContext('2d');
  g.setTransform(d,0,0,d,0,0);
  g.clearRect(0,0,PW,PH);

  /* sleeve interior */
  var pg=g.createLinearGradient(0,0,PW*0.6,PH);
  pg.addColorStop(0,'#141519');pg.addColorStop(0.4,'#0f1013');pg.addColorStop(1,'#141519');
  g.fillStyle=pg;g.fillRect(0,0,PW,PH);

  /* the card */
  g.save();
  roundRect(g,BX,BY,BW,BH,6);
  g.shadowColor='rgba(0,0,0,.72)';g.shadowBlur=12;g.shadowOffsetY=2;
  var cg=g.createRadialGradient(BX+BW*0.5,BY+BH*0.22,10,BX+BW*0.5,BY+BH*0.22,BW*1.15);
  cg.addColorStop(0,'#1c1c1c');cg.addColorStop(0.55,'#161616');cg.addColorStop(1,'#121212');
  g.fillStyle=cg;g.fill();
  g.shadowColor='transparent';
  g.strokeStyle='rgba(255,255,255,.035)';g.lineWidth=1;g.stroke();
  g.restore();

  g.save();
  roundRect(g,BX,BY,BW,BH,6);g.clip();
  g.translate(BX,BY);                      /* card-local coordinates */
  g.textBaseline='alphabetic';

  /* ghost year */
  g.font='700 196px '+MONO;
  g.fillStyle='#1d1d1d';
  var gy=BH-146-196*0.8;
  track(g,'26',BW+24,baseAt(g,gy,196),-11.8,'right');

  /* header */
  if(logoImg.complete&&logoImg.naturalWidth){
    var lw=196,lh=lw*logoImg.naturalHeight/logoImg.naturalWidth;
    if(!whiteLogo){
      whiteLogo=document.createElement('canvas');
      whiteLogo.width=Math.ceil(lw);whiteLogo.height=Math.ceil(lh);
      var lg=whiteLogo.getContext('2d');
      lg.drawImage(logoImg,0,0,whiteLogo.width,whiteLogo.height);
      lg.globalCompositeOperation='source-in';
      lg.fillStyle='#fff';
      lg.fillRect(0,0,whiteLogo.width,whiteLogo.height);
    }
    g.drawImage(whiteLogo,22,12,lw,lh);
  }

  g.font='11px '+MONO;g.fillStyle='#7c7c7c';
  track(g,'EMP 1042',BW-22,baseAt(g,22,11),1.54,'right');

  g.fillStyle='rgba(255,255,255,.10)';
  g.fillRect(22,68,BW-44,1);
  g.fillRect(22,BH-132,BW-44,1);

  g.font='11px '+MONO;g.fillStyle='#8e8e8e';
  track(g,'NEW EMPLOYEE',22,baseAt(g,78,11),1.98);

  g.font='11px '+MONO;g.fillStyle='#9b9b9b';
  track(g,'ROLE: TEAM MEMBER',22,baseAt(g,250,11),1.65);

  /* attendee chip */
  g.strokeStyle='rgba(255,255,255,.22)';g.lineWidth=1;
  roundRect(g,22.5,284.5,96,23,3);g.stroke();
  g.font='10px '+MONO;g.fillStyle='#cfcfcf';
  track(g,'NEW HIRE',32,baseAt(g,289,10)+1,2.4);

  g.font='10px '+MONO;g.fillStyle='#7c7c7c';
  track(g,'START: DAY ONE',BW-22,baseAt(g,290,10)+1,1.6,'right');

  /* barcode + numbers */
  g.globalAlpha=0.6;
  g.drawImage(barcodeCv,22,BH-118,198,30);
  g.globalAlpha=1;
  g.font='10px '+MONO;g.fillStyle='#6f6f6f';
  track(g,'4 127 0806 22619',22,baseAt(g,BH-72,10),3);
  g.font='10px '+MONO;g.fillStyle='#9a9a9a';
  track(g,'WELCOME',BW-22,baseAt(g,BH-106,10),2.4,'right');
  g.font='11px '+MONO;g.fillStyle='#a3a3a3';
  track(g,'NEW HAMPSHIRE, USA · REMOTE',22,baseAt(g,BH-37,11),1.2);
  g.restore();

  /* the name lives on its own layer so it can invert against the heat */
  var ng=nameCv.getContext('2d');
  ng.setTransform(d,0,0,d,0,0);
  ng.clearRect(0,0,PW,PH);
  ng.textBaseline='alphabetic';
  ng.font='700 58px '+COND;
  ng.fillStyle='#e7e7e7';
  ng.fillText('NEW HIRE',BX+22,BY+baseAt(ng,156,58));
}

function paintFace(){
  var g=fctx,d=dpr||1;
  g.setTransform(d,0,0,d,0,0);
  g.globalCompositeOperation='source-over';
  g.clearRect(0,0,PW,PH);
  g.drawImage(printCv,0,0,PW,PH);

  g.save();
  roundRect(g,BX,BY,BW,BH,6);g.clip();
  g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';
  g.globalCompositeOperation='screen';
  g.drawImage(hbuf,BX,BY,BW,BH);          /* heat blends into the print   */
  g.globalCompositeOperation='difference';
  g.drawImage(nameCv,0,0,PW,PH);          /* the name inverts through it  */
  g.restore();

  g.globalCompositeOperation='screen';
  g.drawImage(gbuf,0,0,PW,PH);            /* vinyl highlights on top      */
  g.globalCompositeOperation='source-over';
}

/* =====================================================================
   lanyard — two verlet cords tied to the badge, which is a rigid body.
   Positions are solved with PBD so tension, swing and recoil all fall
   out of the constraints instead of being animated.
   ===================================================================== */
var OY=60,OX=0,CW=364,CH=800,               /* cord canvas overhang: it must never clip */
    G=1500,                                  /* gravity, px/s^2                     */
    SCENE_H=742,                             /* scene height, set from the viewport */
    REST_TOP=202,                            /* where the sleeve hangs at rest      */
    ATTACH=[PW*0.5,27],                      /* slot, in sleeve coordinates         */
    ANCHORS=[[PW*0.5-46,-80],[PW*0.5+46,-80]];

function Cord(ax,ay,tx,ty,n){
  this.n=n;this.x=new Float64Array(n);this.y=new Float64Array(n);
  this.px=new Float64Array(n);this.py=new Float64Array(n);
  for(var i=0;i<n;i++){
    var t=i/(n-1);
    this.x[i]=this.px[i]=ax+(tx-ax)*t;
    this.y[i]=this.py[i]=ay+(ty-ay)*t;
  }
  this.ax=ax;this.ay=ay;
  this.seg=Math.hypot(tx-ax,ty-ay)/(n-1)*1.004;   /* a whisker of slack */
  this.im=1/0.016;                                 /* webbing is light   */
}
var cords=[];
function buildCords(){
  var ty=REST_TOP+ATTACH[1],
      len=Math.hypot(ATTACH[0]-ANCHORS[0][0],ty-ANCHORS[0][1]),
      n=Math.max(14,Math.min(46,Math.round(len/13)));
  cords=[
    new Cord(ANCHORS[0][0],ANCHORS[0][1],ATTACH[0],ty,n),
    new Cord(ANCHORS[1][0],ANCHORS[1][1],ATTACH[0],ty,n)
  ];
}

/* rigid sleeve: centre of mass, angle, and their previous values */
var body={
  x:PW*0.5,y:REST_TOP+PH*0.5,px:PW*0.5,py:REST_TOP+PH*0.5,
  a:0,pa:0,
  M:1,im:1,
  I:(PW*PW+PH*PH)/12,
  rx:ATTACH[0]-PW*0.5, ry:ATTACH[1]-PH*0.5      /* slot, relative to the centre */
};
body.iI=1/body.I;
var grab=null;                                   /* {rx,ry,x,y} while dragging */

var VMAX=1300;   /* px per second - keeps the solver honest */
function solve(dt){
  var i,c,k;
  /* --- integrate --- */
  for(k=0;k<cords.length;k++){
    c=cords[k];
    for(i=1;i<c.n;i++){
      var vx=(c.x[i]-c.px[i])*0.997,vy=(c.y[i]-c.py[i])*0.997;
      var vlen=Math.hypot(vx,vy),vmax=VMAX*dt;
      if(vlen>vmax){vx*=vmax/vlen;vy*=vmax/vlen;}
      c.px[i]=c.x[i];c.py[i]=c.y[i];

    }

  }

  body.px=body.x;body.py=body.y;body.pa=body.a;

          c.x[i+1]-=dx*diff;c.y[i+1]-=dy*diff;
        }else{
          c.x[i]+=dx*diff*0.5;c.y[i]+=dy*diff*0.5;
          c.x[i+1]-=dx*diff*0.5;c.y[i+1]-=dy*diff*0.5;
        }
      }
      /* gentle bending: webbing does not kink */
      for(i=0;i<c.n-2;i++){
        var bx=c.x[i+2]-c.x[i],by=c.y[i+2]-c.y[i],bd=Math.sqrt(bx*bx+by*by)||1e-6,
            rest=c.seg*1.94,bdiff=(bd-rest)/bd*0.055;
        if(bd<rest){
          var s0=i===0?0:1;
          if(s0){c.x[i]+=bx*bdiff*0.5;c.y[i]+=by*bdiff*0.5;}
          c.x[i+2]-=bx*bdiff*(s0?0.5:1);c.y[i+2]-=by*bdiff*(s0?0.5:1);
        }
      }
      c.x[0]=c.ax;c.y[0]=c.ay;

      /* --- tie the cord end to the sleeve's slot (distance joint) --- */
      var ca=Math.cos(body.a),sa=Math.sin(body.a),
          wx=body.x+body.rx*ca-body.ry*sa,
          wy=body.y+body.rx*sa+body.ry*ca,
          ex=c.x[c.n-1],ey=c.y[c.n-1],
          jx=ex-wx,jy=ey-wy,jd=Math.sqrt(jx*jx+jy*jy);
      if(jd>1e-6){
        var nx=jx/jd,ny=jy/jd,
            lx=wx-body.x,ly=wy-body.y,
            rn=lx*ny-ly*nx,
            wB=body.im+rn*rn*body.iI,
            wP=c.im,
            lam=jd/(wB+wP);
        c.x[c.n-1]-=nx*lam*wP;c.y[c.n-1]-=ny*lam*wP;
        body.x+=nx*lam*body.im;body.y+=ny*lam*body.im;
        body.a+=rn*lam*body.iI;
      }
    }
    /* --- dragging --- */
    if(grab){
      var ca2=Math.cos(body.a),sa2=Math.sin(body.a),
          gx=body.x+grab.rx*ca2-grab.ry*sa2,
          gy=body.y+grab.rx*sa2+grab.ry*ca2,
          dxg=grab.x-gx,dyg=grab.y-gy,dg=Math.sqrt(dxg*dxg+dyg*dyg);
      if(dg>1e-6){
        var nxg=dxg/dg,nyg=dyg/dg,
            lxg=gx-body.x,lyg=gy-body.y,
            rng=lxg*nyg-lyg*nxg,
            wBg=body.im+rng*rng*body.iI,
            lamg=Math.min(dg,4.2)/wBg*0.40;
        body.x+=nxg*lamg*body.im;body.y+=nyg*lamg*body.im;
        body.a+=rng*lamg*body.iI;
      }
    }
  }
  if(body.a>0.6)body.a=0.6;if(body.a<-0.6)body.a=-0.6;
}

/* ---------- ribbon renderer: a flat woven strap that twists as it hangs ---------- */
var cctx=cordCv.getContext('2d'),
    LIGHT=[-0.38,-0.62,0.69],
    LL=Math.hypot(LIGHT[0],LIGHT[1],LIGHT[2]);
LIGHT[0]/=LL;LIGHT[1]/=LL;LIGHT[2]/=LL;
var HV=[LIGHT[0],LIGHT[1],LIGHT[2]+1],HL=Math.hypot(HV[0],HV[1],HV[2]);
HV[0]/=HL;HV[1]/=HL;HV[2]/=HL;

/* the weave and the print are baked once, then mapped along the cord */
var STRIP_W=1200,STRIP_H=30,
    strip=document.createElement('canvas'),sctx;
strip.width=STRIP_W;strip.height=STRIP_H;sctx=strip.getContext('2d');
(function(){
  var x;
  sctx.strokeStyle='rgba(255,255,255,.13)';sctx.lineWidth=1.15;
  for(x=-STRIP_H;x<STRIP_W;x+=4.5){
    sctx.beginPath();sctx.moveTo(x,0);sctx.lineTo(x+STRIP_H*0.75,STRIP_H);sctx.stroke();
  }
  sctx.strokeStyle='rgba(255,255,255,.10)';sctx.lineWidth=1;
  sctx.beginPath();
  sctx.moveTo(0,2.5);sctx.lineTo(STRIP_W,2.5);
  sctx.moveTo(0,STRIP_H-2.5);sctx.lineTo(STRIP_W,STRIP_H-2.5);
  sctx.stroke();
  sctx.font='700 8.5px Arimo,Arial,sans-serif';
  sctx.textBaseline='middle';sctx.textAlign='left';
  sctx.fillStyle='rgba(255,255,255,.52)';
  var word='DATASERV  \u00b7  NEW HIRE  \u00b7  ',
      wlen=sctx.measureText(word).width;
  for(x=0;x<STRIP_W;x+=wlen)sctx.fillText(word,x,STRIP_H*0.5+0.5);
})();

function samplePath(c){
  /* catmull-rom through the particles for a smooth cord */
  var pts=[],i,t,SUB=4;
  function P(i){i=i<0?0:i>c.n-1?c.n-1:i;return [c.x[i],c.y[i]];}
  for(i=0;i<c.n-1;i++){
    var p0=P(i-1),p1=P(i),p2=P(i+1),p3=P(i+2);
    for(t=0;t<SUB;t++){
      var u=t/SUB,u2=u*u,u3=u2*u;
      pts.push([
        0.5*((2*p1[0])+(-p0[0]+p2[0])*u+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*u2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*u3),
        0.5*((2*p1[1])+(-p0[1]+p2[1])*u+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*u2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*u3)
      ]);
    }
  }
  pts.push([c.x[c.n-1],c.y[c.n-1]]);
  return pts;
}

function drawCord(c,phase){
  var pts=samplePath(c),n=pts.length,i,
      W=13.5,                                  /* webbing half-width at full face */
      arc=0,arcs=new Float64Array(n);
  for(i=1;i<n;i++){arc+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);arcs[i]=arc;}

  var left=new Array(n),right=new Array(n),shade=new Array(n),twist=new Array(n);
  for(i=0;i<n;i++){
    var a=pts[Math.max(0,i-1)],b=pts[Math.min(n-1,i+1)],
        tx=b[0]-a[0],ty=b[1]-a[1],tl=Math.hypot(tx,ty)||1e-6;
    tx/=tl;ty/=tl;
    var nx=-ty,ny=tx,
        sArc=arcs[i],
        ph=phase+0.62*Math.sin(sArc*0.017+1.1)+0.34*Math.sin(sArc*0.041+3.0),
        cph=Math.cos(ph),sph=Math.sin(ph),
        w=W*(0.42+0.58*Math.abs(cph));
    left[i]=[pts[i][0]+nx*w,pts[i][1]+ny*w];
    right[i]=[pts[i][0]-nx*w,pts[i][1]-ny*w];
    /* surface normal of the strap in 3d, then lambert + a tight sheen */
    var Nx=nx*sph,Ny=ny*sph,Nz=cph,
        dif=Nx*LIGHT[0]+Ny*LIGHT[1]+Nz*LIGHT[2];
    if(dif<0)dif=-dif*0.35;
    var sp=Nx*HV[0]+Ny*HV[1]+Nz*HV[2];
    sp=sp>0?Math.pow(sp,26):0;
    shade[i]=[dif,sp,Math.abs(cph)];
    twist[i]=ph;
  }

  /* body of the strap */
  for(i=0;i<n-1;i++){
    var d0=shade[i][0],d1=shade[i+1][0],d=(d0+d1)*0.5,
        sp=(shade[i][1]+shade[i+1][1])*0.5,
        tuck=i>n-9?0.30+0.70*(n-1-i)/8:1,      /* fades into the crimp */
        base=(22+d*70+sp*160)*tuck,
        r=Math.min(255,base*0.86),g=Math.min(255,base*0.92),b2=Math.min(255,base*1.08);
    cctx.beginPath();
    cctx.moveTo(left[i][0],left[i][1]);
    cctx.lineTo(left[i+1][0],left[i+1][1]);
    cctx.lineTo(right[i+1][0],right[i+1][1]);
    cctx.lineTo(right[i][0],right[i][1]);
    cctx.closePath();
    cctx.fillStyle='rgb('+(r|0)+','+(g|0)+','+(b2|0)+')';
    cctx.fill();
  }

  /* woven texture + printed event name, mapped along the strap */
  var texOff=phase*180+40;
  for(i=0;i<n-2;i+=2){
    var f=(shade[i][2]+shade[i+2][2])*0.5;
    if(f<0.10)continue;
    var ax2=pts[i][0],ay2=pts[i][1],
        bx2=pts[i+2][0],by2=pts[i+2][1],
        ddx=bx2-ax2,ddy=by2-ay2,seglen=Math.hypot(ddx,ddy);
    if(seglen<0.4)continue;
    var hw=(Math.hypot(left[i][0]-right[i][0],left[i][1]-right[i][1])+
            Math.hypot(left[i+2][0]-right[i+2][0],left[i+2][1]-right[i+2][1]))*0.25;
    cctx.save();
    cctx.translate(ax2,ay2);
    cctx.rotate(Math.atan2(ddy,ddx));
    cctx.globalAlpha=Math.min(1,0.22+0.85*shade[i][0]);
    cctx.drawImage(strip,(texOff+arcs[i])%(STRIP_W-120),0,seglen,STRIP_H,
                   0,-hw,seglen,hw*2);
    cctx.restore();
  }
  cctx.globalAlpha=1;

  /* edge stitch */
  cctx.lineWidth=1;
  cctx.strokeStyle='rgba(0,0,0,.55)';
  cctx.beginPath();cctx.moveTo(left[0][0],left[0][1]);
  for(i=1;i<n;i++)cctx.lineTo(left[i][0],left[i][1]);
  cctx.stroke();
  cctx.beginPath();cctx.moveTo(right[0][0],right[0][1]);
  for(i=1;i<n;i++)cctx.lineTo(right[i][0],right[i][1]);
  cctx.stroke();
}

function paintCords(){
  cctx.setTransform(cdpr,0,0,cdpr,cdpr*OX,cdpr*OY);
  cctx.clearRect(-OX,-OY,CW,CH);
  drawCord(cords[0],0.55);
  drawCord(cords[1],-0.35);
}

/* =====================================================================
   sizing
   ===================================================================== */
var dpr=0,cdpr=1;
function sizeCanvases(){
  var d=dpr;
  faceCv.width=Math.round(PW*d);faceCv.height=Math.round(PH*d);
  cdpr=d;
  cordCv.width=Math.round(CW*d);cordCv.height=Math.round(CH*d);
  cordCv.style.width=CW+'px';cordCv.style.height=CH+'px';
  buildPrint();
}
function resize(){
  var d=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  if(d===dpr)return;
  dpr=d;sizeCanvases();paintHeat();
}
/* the badge sits in the middle of the window and the cord leaves through the top */
function layout(){
  var vw=window.innerWidth,vh=window.innerHeight,
      s=Math.min(1,(vw-28)/PW,(vh-28)/(PH+150));
  fit.style.setProperty('--fit',s.toFixed(4));
  SCENE_H=Math.max(PH+150,Math.round(vh/s));
  REST_TOP=Math.round((SCENE_H-PH)/2);
  OY=60;
  /* room for the badge to be flung to either side and below */
  CW=Math.ceil(vw/s)+PW;
  CH=SCENE_H+OY+PH*0.6;
  OX=Math.round((CW-PW)/2);
  scene.style.setProperty('--sh',SCENE_H+'px');
  scene.style.setProperty('--oy',OY+'px');
  scene.style.setProperty('--ox',OX+'px');
  rig.style.setProperty('--rigtop',REST_TOP+'px');
  ANCHORS=[[PW*0.5-46,-OY-26],[PW*0.5+46,-OY-26]];
  buildCords();
  body.x=body.px=PW*0.5;body.y=body.py=REST_TOP+PH*0.5;body.a=body.pa=0;
  if(dpr)sizeCanvases();
}

/* =====================================================================
   pointer, tilt, swing
   ===================================================================== */
var px=0,py=0,inside=false,hasPrev=false,prevX=0,prevY=0,
    sx=BW/2,sy=BH/2,tx=BW/2,ty=BH/2,aim=false;

function scenePos(e){
  var r=scene.getBoundingClientRect(),sc=r.width/PW;   /* the scene never rotates */
  return [(e.clientX-r.left)/sc,(e.clientY-r.top)/sc];
}
function onMove(e){
  var sp=scenePos(e);
  /* the sleeve may be swinging: map the scene point into its own frame */
  var ca=Math.cos(-body.a),sa=Math.sin(-body.a),
      dx=sp[0]-body.x,dy=sp[1]-body.y,
      lx=dx*ca-dy*sa+PW*0.5,ly=dx*sa+dy*ca+PH*0.5;
  px=lx-BX;py=ly-BY;
  inside=(px>=0&&px<=BW&&py>=0&&py<=BH);
  var over=(lx>=-30&&lx<=PW+30&&ly>=-30&&ly<=PH+30);
  if(over){tx=Math.max(0,Math.min(BW,px));ty=Math.max(0,Math.min(BH,py));aim=true;}
  else aim=false;
  if(grab){grab.x=sp[0];grab.y=sp[1];}   /* it only moves while you hold it */
}
function onDown(e){
  onMove(e);
  var sp=scenePos(e),
      ca=Math.cos(-body.a),sa=Math.sin(-body.a),
      dx=sp[0]-body.x,dy=sp[1]-body.y;
  var lx=dx*ca-dy*sa,ly=dx*sa+dy*ca;
  if(Math.abs(lx)<=PW*0.5&&Math.abs(ly)<=PH*0.5){
    grab={rx:lx,ry:ly,x:sp[0],y:sp[1]};
    holder.style.cursor='grabbing';
  }
}
function onUp(){grab=null;holder.style.cursor='';}
window.addEventListener('pointermove',onMove,{passive:true});
window.addEventListener('pointerdown',onDown,{passive:true});
window.addEventListener('pointerup',onUp,{passive:true});
window.addEventListener('pointercancel',onUp,{passive:true});
window.addEventListener('pointerleave',function(){inside=false;aim=false;});
window.addEventListener('blur',function(){inside=false;aim=false;grab=null;});

var TILT_X=8,TILT_Y=13,TILT_TAU=0.15,rxNow=0,ryNow=0,lastGX=99,lastGY=99,lastGZ=99;

function advance(dt,x,y,ins){
  var gx=aim?tx:BW/2,gy=aim?ty:BH/2,e=1-Math.exp(-dt/TILT_TAU);
  sx+=(gx-sx)*e;sy+=(gy-sy)*e;
  rxNow=(sy/BH-0.5)*2*TILT_X;
  ryNow=(sx/BW-0.5)*2*TILT_Y;

  /* rope + rigid body, fixed substeps so the cord never explodes */
  acc+=dt;
  var guard=0;
  while(acc>=SUB&&guard++<8){solve(SUB);acc-=SUB;}
  if(acc>SUB*8)acc=0;
  var deg=body.a*180/Math.PI;
  rig.style.transform='translate('+(body.x-PW*0.5).toFixed(2)+'px,'+
                      (body.y-(REST_TOP+PH*0.5)).toFixed(2)+'px) rotate('+deg.toFixed(3)+'deg)';
  holder.style.setProperty('--rx',rxNow.toFixed(3)+'deg');
  holder.style.setProperty('--ry',ryNow.toFixed(3)+'deg');
  rig.style.setProperty('--lang',(ryNow*2.2).toFixed(2)+'deg');
  paintCords();

  var dec=Math.exp(-dt/TAU),n=GW*GH,p;
  if(heatLive)for(p=0;p<n;p++)field[p]*=dec;

  if(ins){
    if(!hasPrev){prevX=x;prevY=y;hasPrev=true;}
    var d=Math.hypot(x-prevX,y-prevY),steps=Math.max(1,Math.ceil(d/6)),s,f;
    for(s=1;s<=steps;s++){
      f=s/steps;
      stamp(prevX+(x-prevX)*f,prevY+(y-prevY)*f,GAIN*dt/steps);
    }
    prevX=x;prevY=y;
  }else hasPrev=false;

  if(heatLive||ins)paintHeat();
  if(Math.abs(rxNow-lastGX)>0.02||Math.abs(ryNow-lastGY)>0.02||Math.abs(body.a-lastGZ)>0.0025){
    lastGX=rxNow;lastGY=ryNow;lastGZ=body.a;paintGloss(rxNow,ryNow,body.a);
  }
  paintFace();
}

var last=0,acc=0,SUB=1/240;
function frame(now){
  var dt=last?Math.min(0.08,(now-last)/1000):1/60;last=now;
  resize();
  advance(dt,px,py,inside);
  requestAnimationFrame(frame);
}
window.addEventListener('resize',function(){layout();settle();});
resize();layout();paintGloss(0,0,0);paintFace();
logoImg.onload=function(){buildPrint();paintFace();};
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){buildPrint();paintFace();});
function settle(){for(var wi=0;wi<520;wi++)solve(SUB);paintCords();}
settle();
requestAnimationFrame(frame);
})();
</script>
</body>
