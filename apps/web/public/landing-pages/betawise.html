<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Betawise — Redefining Attribution with AI-Powered Data Precision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Questrial&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------
   Design reference frame: 1138 x 720.  --u is one reference pixel, so
   every number below is a measurement taken off the reference and the
   whole composition scales as one piece.  The width term divides by 952
   rather than 1138 so portrait viewports do not shrink the type; at the
   reference aspect the height term is the one that binds.
-------------------------------------------------------------------*/
:root{
  --u: clamp(0.62px, min(0.1050420vw, 0.1388889vh), 1.42px);
  --nav-h: calc(27.5*var(--u));
  --btn-h: calc(34.4*var(--u));
  --ink:#ffffff;
  --dim:rgba(232,240,252,.62);
  --nav:rgba(255,255,255,.56);
  --paper:#f2f2f3;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:#000;
  color:var(--ink);
  font-family:"Questrial",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow:hidden;
}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}

/* vignette + a faint lift under the copy so the type stays legible */
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(120% 78% at 50% 47%, rgba(0,0,0,0) 34%, rgba(0,0,0,.34) 78%, rgba(0,0,0,.62) 100%),
    radial-gradient(46% 20% at 50% 50%, rgba(0,0,0,.30) 0%, rgba(0,0,0,0) 72%);
}

/* ---------------- nav ---------------- */
header{position:fixed;top:0;left:0;right:0;z-index:3;padding-top:calc(28.8*var(--u))}
.bar{
  width:calc(594*var(--u));max-width:calc(100vw - 40*var(--u));
  margin:0 auto;height:calc(27.5*var(--u));
  display:flex;align-items:center;justify-content:space-between;
}
.brand{display:flex;align-items:baseline;
  font-family:"Inter",sans-serif;font-weight:700;font-size:calc(13.5*var(--u));
  letter-spacing:calc(-0.22*var(--u));color:#fff;text-decoration:none;line-height:1}
nav{display:flex;align-items:center;gap:calc(30.2*var(--u))}
nav a{font-size:calc(11.1*var(--u));color:var(--nav);text-decoration:none;line-height:1;
  transition:color .25s ease}
nav a:hover{color:#fff}
.cta{
  height:var(--nav-h);padding:0 calc(12.5*var(--u));border-radius:999px;
  background:var(--paper);color:#17191c;font-size:calc(11.1*var(--u));
  display:inline-flex;align-items:center;text-decoration:none;line-height:1;
  transition:background .25s ease,transform .25s ease;white-space:nowrap;
}
.cta:hover{background:#fff;transform:translateY(calc(-0.7*var(--u)))}
.cta.lm-btn{background:none;color:#fff}
.cta.lm-btn:hover{background:none;transform:none}

/* ---------------- hero copy ---------------- */
main{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;
  align-items:center;pointer-events:none}
.copy{position:absolute;top:calc(50% - 83.6*var(--u));left:0;right:0;text-align:center}
h1{
  font-size:calc(40.4*var(--u));line-height:calc(42.5*var(--u));
  letter-spacing:calc(-0.40*var(--u));font-weight:400;color:#fff;
  text-shadow:0 0 calc(26*var(--u)) rgba(4,14,26,.55);
}
.sub{
  margin-top:calc(11.9*var(--u));font-size:calc(12.66*var(--u));line-height:1.2;
  color:var(--dim);letter-spacing:calc(0.02*var(--u));
  text-shadow:0 0 calc(16*var(--u)) rgba(4,14,26,.6);
}
.btns{margin-top:calc(18.6*var(--u));display:flex;align-items:center;
  justify-content:center;gap:calc(12.2*var(--u));pointer-events:auto}
.btn{
  height:var(--btn-h);border-radius:999px;
  display:inline-flex;align-items:center;justify-content:center;
  gap:calc(6.4*var(--u));text-decoration:none;line-height:1;white-space:nowrap;
  font-size:calc(11.7*var(--u));font-weight:400;letter-spacing:.001em;
  transition:transform .22s cubic-bezier(.22,1,.36,1),background .22s ease,box-shadow .22s ease;
}
.btn:hover{transform:translateY(calc(-1.6*var(--u)))}
.lm .btn:hover{transform:none}
.btn-solid{background:#F6F6F4;color:#08090C;padding:0 calc(14.6*var(--u))}
.lm .btn-solid{padding:0 calc(14.6*var(--u));background:none;color:#fff;box-shadow:none}
.lm .btn-solid:hover{background:none;box-shadow:none}
.btn-ghost{
  position:relative;color:#fff;padding:0 calc(12*var(--u));
  background:
    linear-gradient(180deg, rgba(255,255,255,.085), rgba(255,255,255,.02) 48%, rgba(255,255,255,0)),
    rgba(9,12,17,.42);
  box-shadow:0 calc(6.4*var(--u)) calc(19*var(--u)) rgba(0,0,0,.30);
  -webkit-backdrop-filter:blur(calc(9.6*var(--u))) saturate(1.15);
          backdrop-filter:blur(calc(9.6*var(--u))) saturate(1.15);
  transition:transform .22s cubic-bezier(.22,1,.36,1),background .22s ease;
}
.btn-ghost::before{opacity:.92;transition:opacity .22s ease}
.btn-ghost:hover::before{opacity:1}
.btn-ghost:hover{
  background:
    linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.04) 48%, rgba(255,255,255,.01)),
    rgba(12,16,22,.46);
}
.btn-ghost svg{width:calc(11.7*var(--u));height:calc(7.5*var(--u));flex:none;opacity:.96}

/* hairline gradient border, masked so only the 1px ring paints */
.edge::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:linear-gradient(176deg,
    rgba(255,255,255,.26) 0%,
    rgba(170,214,255,.13) 40%,
    rgba(255,255,255,.055) 74%,
    rgba(255,255,255,.032) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  pointer-events:none;
}

/* --------------------- liquid metal CTA (ThreeUI) ---------------------
   The button is a dark plate; a WebGL2 canvas overspills it on every side so
   the bloom has room, and the label rides on top.  --pad has to clear the
   glow's full reach or it gets cut off against the canvas edge.
   NB: the local unit is --lmu, not --u — the page already uses --u for its
   own composition scale and shadowing it here would resize the layout. */
.lm-nav{--h:var(--nav-h)}
.lm-hero{--h:var(--btn-h)}
.lm{
  position:relative;display:inline-flex;
  --lmu:calc(var(--h) / 516);
  --pad:calc(760 * var(--lmu));
  isolation:isolate;
}
.lm-plate{
  position:absolute;inset:0;border-radius:999px;background:#0b0c0e;
  box-shadow:
    0 calc(var(--h) * .10) calc(var(--h) * .22) rgba(0,0,0,.72),
    0 calc(var(--h) * .30) calc(var(--h) * .66) rgba(0,0,0,.62),
    0 calc(var(--h) * .62) calc(var(--h) * 1.30) rgba(0,0,0,.42);
  transition:box-shadow .38s cubic-bezier(.22,.61,.36,1),
             background .38s cubic-bezier(.22,.61,.36,1);
}
.lm.is-hot .lm-plate{
  background:#08090a;
  box-shadow:
    0 calc(var(--h) * .12) calc(var(--h) * .26) rgba(0,0,0,.80),
    0 calc(var(--h) * .40) calc(var(--h) * .86) rgba(0,0,0,.72),
    0 calc(var(--h) * .86) calc(var(--h) * 1.80) rgba(0,0,0,.55);
}
.lm.is-press .lm-plate{
  background:#070809;
  box-shadow:
    0 calc(var(--h) * .05) calc(var(--h) * .13) rgba(0,0,0,.82),
    0 calc(var(--h) * .16) calc(var(--h) * .40) rgba(0,0,0,.70),
    0 calc(var(--h) * .34) calc(var(--h) * .80) rgba(0,0,0,.50);
  transition-duration:.10s;
}
.lm-fx{
  position:absolute;
  left:calc(-1 * var(--pad));top:calc(-1 * var(--pad));
  width:calc(100% + 2 * var(--pad));height:calc(100% + 2 * var(--pad));
  display:block;pointer-events:none;
}
.lm-btn{
  position:relative;
  background:none;color:#fff;box-shadow:none;
  -webkit-tap-highlight-color:transparent;
}
.lm-btn:hover{background:none;box-shadow:none}
.lm-btn:focus-visible{outline:2px solid rgba(255,255,255,.55);outline-offset:3px}
/* no WebGL2: fall back to the flat pills */
.lm-off .lm-fx{display:none}
.lm-off .lm-btn{background:#F6F6F4;color:#08090C}
.lm-off .lm-plate{display:none}

/* the copy fades up once the cloud has landed */
.copy>*{opacity:0;transform:translateY(calc(10*var(--u)));
  animation:rise .95s cubic-bezier(.16,.84,.3,1) forwards}
h1{animation-delay:.20s}
.sub{animation-delay:.32s}
.btns{animation-delay:.44s}
.bar>*{opacity:0;animation:fade .9s ease forwards;animation-delay:.16s}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}

@media (prefers-reduced-motion:reduce){
  .copy>*,.bar>*{animation-duration:.01s;animation-delay:0s}
}
@media (max-width:760px){
  :root{--nav-h:34px;--btn-h:44px}
  .bar{width:auto;padding:0 20px}
  nav{display:none}
  header{padding-top:20px}
  .brand{font-size:16px}
  .cta{padding:0 15px;font-size:13px}
  .copy{top:calc(50% - 108px);padding:0 22px}
  h1{font-size:clamp(25px,6.9vw,35px);line-height:1.10;letter-spacing:-.012em;text-wrap:balance}
  h1 br{display:none}
  .sub{font-size:clamp(13px,3.4vw,16px);margin-top:14px}
  .btns{margin-top:22px;gap:9px}
  .btn{font-size:14px;gap:6px}
  .btn-solid,.btn-ghost{padding:0 20px}
  .btn-ghost svg{width:12.5px;height:8px}
}
</style>

    </span>
  </div>
</header>

      </a>
    </div>
  </div>
</main>

/* ---------------------------------------------------------------
   2. Build the stroke field over the sphere
----------------------------------------------------------------*/
function buildGlobe() {
  var R = 0.5;                                   /* diameter 1.0 */
  var SP = CFG.SPACING;
  var rings = Math.max(24, Math.round(Math.PI * R / SP));
  var pos = [], nor = [], tip = [], rnd = [], lnd = [];

  for (var j = 0; j < rings; j++) {
    var th = (j + 0.5) / rings * Math.PI;        /* 0 at the north pole */
    var sT = Math.sin(th), cT = Math.cos(th);
    var circ = 2 * Math.PI * R * sT;
    /* constant meridians, halved toward the poles — keeps the ticks in
       columns without piling every one of them onto the pole */
    var nu = CFG.MERIDIANS;
    while (nu > 12 && circ / nu < SP * 0.60) nu >>= 1;
    var lat = 90 - th * 180 / Math.PI;

    for (var k = 0; k < nu; k++) {
      var ph = (k / nu) * Math.PI * 2;
      var x = R * sT * Math.sin(ph), y = R * cT, z = R * sT * Math.cos(ph);
      var lon = ph * 180 / Math.PI + CFG.LON0;
      if (lon > 180) lon -= 360;
      var L = landSoft(lon, lat);
      var r = Math.random();
      pos.push(x, y, z, x, y, z);
      nor.push(x / R, y / R, z / R, x / R, y / R, z / R);
      tip.push(0, 1);
      rnd.push(r, r);
      lnd.push(L, L);
    }
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aN', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('aTip', new THREE.Float32BufferAttribute(tip, 1));
  g.setAttribute('aR', new THREE.Float32BufferAttribute(rnd, 1));
  g.setAttribute('aL', new THREE.Float32BufferAttribute(lnd, 1));
  g.userData.count = tip.length / 2;
  return g;
}

   3. Dust — a slow nebula that thickens toward the shoulders
----------------------------------------------------------------*/
function hash3(x, y, z) {
  var n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453;
  return n - Math.floor(n);
}
function vnoise(x, y, z) {
  var xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  var xf = x - xi, yf = y - yi, zf = z - zi;
  var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  function L(a, b, t) { return a + (b - a) * t; }
  var c000 = hash3(xi, yi, zi), c100 = hash3(xi + 1, yi, zi);
  var c010 = hash3(xi, yi + 1, zi), c110 = hash3(xi + 1, yi + 1, zi);
  var c001 = hash3(xi, yi, zi + 1), c101 = hash3(xi + 1, yi, zi + 1);
  var c011 = hash3(xi, yi + 1, zi + 1), c111 = hash3(xi + 1, yi + 1, zi + 1);
  return L(L(L(c000, c100, u), L(c010, c110, u), v), L(L(c001, c101, u), L(c011, c111, u), v), w);
}
function fbm(x, y, z) {
  return 0.58 * vnoise(x, y, z) + 0.28 * vnoise(x * 2.1, y * 2.1, z * 2.1) +
         0.14 * vnoise(x * 4.3, y * 4.3, z * 4.3);
}
/* probability that a point in the star volume is kept */
function dustW(x, y, z) {
  /* A starfield, not fog: mostly even, gently clustered, thinning to black
     before the frame edge.  A weak halo still gathers around the globe so the
     composition has a centre, and the hole is keyed to the *projected* limb so
     stars never wash across the continents. */
  var yy = (y + 0.10) / 1.02, zz = z / 1.00;
  var r = Math.sqrt(x * x + yy * yy + zz * zz);
  var rad = 1 / (1 + Math.pow(r / 0.94, 5.0));
  var k = CAM_D / Math.max(CAM_D - z, 0.35);
  var sil = Math.hypot(x * k, y * k - 0.043) / 0.50;        /* 1 = the limb */
  var halo = 0.75 * Math.exp(-Math.pow((sil - 1.30) / 0.62, 2));
  var drift = 0.34 + 0.30 * sm(0.75, -1.0, y);              /* a touch heavier low */
  var cl = 0.45 + 1.05 * Math.pow(fbm(x * 1.7 + 11, y * 1.7 + 5, z * 1.7 + 3), 2.0);
  var hole = 0.10 + 0.90 * sm(0.72, 1.06, sil);
  return Math.max(0, drift + halo) * rad * cl * hole;
}
function lobeAt(x, y) {
  return Math.exp(-Math.pow((Math.hypot(x, y + 0.05) - 0.62) / 0.30, 2));
}
function buildDust(n, sizeExp, wPow) {
  var pos = new Float32Array(n * 3), rnd = new Float32Array(n), siz = new Float32Array(n);
  var bri = new Float32Array(n);
  var i = 0, guard = 0;
  while (i < n && guard < n * 260) {
    guard++;
    var x = (Math.random() * 2 - 1) * 1.65;
    var y = -1.25 + Math.random() * 2.40;
    var z = -1.35 + Math.random() * 2.55;
    if (Math.random() > Math.min(1, Math.pow(dustW(x, y, z), wPow || 1) * 0.10)) continue;
    pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
    rnd[i] = Math.random();
    siz[i] = Math.pow(Math.random(), sizeExp);
    bri[i] = 1 + 0.55 * lobeAt(x, y);
    i++;
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aR', new THREE.BufferAttribute(rnd, 1));
  g.setAttribute('aS', new THREE.BufferAttribute(siz, 1));
  g.setAttribute('aB', new THREE.BufferAttribute(bri, 1));
  g.userData.count = i;
  return g;
}

  var w = window.innerWidth || document.documentElement.clientWidth || 0;

  if (w < 2 || h < 2) return;         /* laid out in a hidden tab — try again later */
  vw = w; vh = h;

----------------------------------------------------------------*/
function ease(x, p) { return 1 - Math.pow(1 - x, p); }
/* The landing is a pull-back and nothing else.  Owner-requested revision,
   2026-08-24: the original curve opened on black, threw the camera in to 3.6x
   at 0.44s and then settled out of the overshoot — three changes of direction.
   This one starts already close and only ever recedes. */
var ZOOM_KF = [
  [0.00, 3.10], [0.10, 2.84], [0.22, 2.42], [0.36, 2.00], [0.52, 1.66],
  [0.70, 1.40], [0.90, 1.24], [1.12, 1.13], [1.36, 1.06], [1.62, 1.02],
  [1.90, 1.00]
];
function zoomAt(tt) {
  if (tt <= ZOOM_KF[0][0]) return ZOOM_KF[0][1];
  var n = ZOOM_KF.length;
  if (tt >= ZOOM_KF[n - 1][0]) return 1;
  for (var i = 0; i < n - 1; i++) {
    if (tt < ZOOM_KF[i + 1][0]) {
      var a = ZOOM_KF[i], b = ZOOM_KF[i + 1];
      var f = (tt - a[0]) / (b[0] - a[0]);
      f = f * f * (3 - 2 * f);
      return a[1] + (b[1] - a[1]) * f;
    }
  }
  return 1;
}
/* Motion-blur envelope.  Magnitudes only — the sign lives at the one place the
   smear is applied, because this same number is also read as a speed for
   gating the streak layers and for scaling exposure, and both of those want it
   positive.  The camera is fastest at t=0 now, not at the top of an overshoot,
   so the trails are longest in the first frame and decay from there. */
var STREAK_KF = [
  [0.00, 0.72], [0.16, 0.58], [0.34, 0.42], [0.55, 0.28], [0.80, 0.16],
  [1.08, 0.08], [1.40, 0.03], [1.75, 0.00]
];
function kf(tbl, tt) {
  var n = tbl.length;
  if (tt <= tbl[0][0]) return tbl[0][1];
  if (tt >= tbl[n - 1][0]) return tbl[n - 1][1];
  for (var i = 0; i < n - 1; i++) {
    if (tt < tbl[i + 1][0]) {
      var a = tbl[i], b = tbl[i + 1], f = (tt - a[0]) / (b[0] - a[0]);
      f = f * f * (3 - 2 * f);
      return a[1] + (b[1] - a[1]) * f;
    }
  }
  return tbl[n - 1][1];
}
/* Exposure ramp.  The original dipped and flared to match a landing that
   overshot; this one only has to carry a recession, so it lifts once and
   settles.  The fade starts at zero rather than at 0.16s, because there is no
   run-up in the dark to hide any more. */
var EXPO_KF = [
  [0.00, 0.86], [0.30, 0.94], [0.60, 1.06], [0.95, 1.12], [1.30, 1.06],
  [1.80, 1.00]
];
function alphaAt(tt) {
  return Math.min(1, Math.max(0, tt / 0.30)) *
         (0.70 + 0.30 * Math.min(1, Math.max(0, (tt - 0.25) / 0.75))) *
         kf(EXPO_KF, tt);
}

  var d = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1);

  if (paused) return;

  if (!camera.userData.D) { resize(); if (!camera.userData.D) return; }

     wobble, so the line layer carries every trail */

  globeMat.uniforms.uTime.value = tt;
  dustMat.uniforms.uAlpha.value = a * (1 - 0.45 * Math.min(1, intro * 0.8));
  dustMat.uniforms.uStreak.value = streak * 0.0;
  dustMat.uniforms.uTime.value = tt;
  streakMat.uniforms.uStreak.value = disp * 1.15;

  globeStreakMat.uniforms.uAlpha.value = a * Math.min(1, streak * 0.85) * 0.155 * comp;
  globeStreakMat.uniforms.uTime.value = tt;

     has landed — asymmetric, so the drop is instant and the return is gentle */
  var arcTarget = 1 - Math.min(1, Math.abs(jump) * 2.4);
  arcFade += (arcTarget - arcFade) * (arcTarget < arcFade ? 0.30 : 0.028);

  arcMat.uniforms.uAlpha.value = arcA;
  arcMat.uniforms.uTime.value = tt;
  arcMat.uniforms.uStreak.value = disp * 0.5;
  cityMat.uniforms.uAlpha.value = arcA;
  cityMat.uniforms.uTime.value = tt;
  cityMat.uniforms.uStreak.value = 0;
  compMat.uniforms.uTime.value = tt;

  renderer.clear(true, true, true);

  brightMat.uniforms.uTexel.value.set(2 / rtScene.width, 2 / rtScene.height);

      downMat.uniforms.uTexel.value.set(1 / mips[i - 1].w, 1 / mips[i - 1].h);

    blurMat.uniforms.tD.value = mips[i].a.texture;
    blurMat.uniforms.uDir.value.set(1 / mips[i].w, 0);
    pass(blurMat, mips[i].b);
    blurMat.uniforms.tD.value = mips[i].b.texture;
    blurMat.uniforms.uDir.value.set(0, 1 / mips[i].h);
    pass(blurMat, mips[i].a);
  }
  compMat.uniforms.tScene.value = rtScene.texture;
  compMat.uniforms.tB0.value = mips[0].a.texture;
  compMat.uniforms.tB1.value = mips[1].a.texture;
  compMat.uniforms.tB2.value = mips[2].a.texture;
  pass(compMat, null);
}

render(elapsed);
frame();
window.__betawise = {
  CFG: CFG, globeMat: globeMat, dustMat: dustMat, streakMat: streakMat, compMat: compMat,
  globe: globe, camera: camera, globeLines: globeLines, dust: dust, arcs: arcs,
  cityDots: cityDots, resize: resize,
  /* deterministic capture hook — freezes the clock so a shot is repeatable */
  shot: function (t, zm) { paused = true; elapsed = t; mouse.x = mouse.y = mouse.tx = mouse.ty = 0;
    arcFade = 1; if (zm) { userZoom = userZoomT = zm; } render(t); },
  play: function () { paused = false; clock.getDelta(); },
  set: function (o) { Object.keys(o).forEach(function (k) { CFG[k] = o[k]; }); apply(); },
  rebuild: function () { globeLines.geometry.dispose(); globeLines.geometry = buildGlobe(); }
};
function apply() {
  globeMat.uniforms.uRimPow.value = CFG.RIM_POW;
  globeMat.uniforms.uRimA.value = CFG.RIM_A;
  globeMat.uniforms.uRimB.value = CFG.RIM_B;
  globeMat.uniforms.uBackMul.value = CFG.BACK_MUL;
  globeMat.uniforms.uGain.value = CFG.GAIN;
  globeMat.uniforms.uLight.value.fromArray(CFG.LIGHT).normalize();
  globeMat.uniforms.uSeaDim.value = CFG.SEA_DIM;
  globeMat.uniforms.uRimLight.value = CFG.RIM_LIGHT;
  globeMat.uniforms.uDeep.value.fromArray(CFG.COL_DEEP);
  globeMat.uniforms.uHot.value.fromArray(CFG.COL_HOT);
  dustMat.uniforms.uGain.value = CFG.DUST_GAIN;
  dustMat.uniforms.uDeep.value.fromArray(CFG.COL_DEEP);
  dustMat.uniforms.uHot.value.fromArray(CFG.COL_HOT);
  arcMat.uniforms.uGain.value = CFG.ARC_GAIN;
  arcMat.uniforms.uBase.value = CFG.ARC_BASE;
  arcMat.uniforms.uTail.value = CFG.ARC_TAIL;
  arcMat.uniforms.uSpeed.value = CFG.ARC_SPEED;
  cityMat.uniforms.uGain.value = CFG.CITY_GAIN;
  compMat.uniforms.uBloom.value = CFG.BLOOM;
  compMat.uniforms.uExp.value = CFG.EXPOSURE;
  compMat.uniforms.uThr && (compMat.uniforms.uThr.value = CFG.BLOOM_THRESH);
  brightMat.uniforms.uThr.value = CFG.BLOOM_THRESH;
}
})();

function build(host){
  var cv  = host.querySelector('.lm-fx');
  var btn = host.querySelector('.lm-btn');
  if(!cv || !btn) return null;
  var gl = cv.getContext('webgl2', {alpha:true, antialias:false,
    premultipliedAlpha:true, powerPreference:'high-performance'});
  if(!gl){ host.classList.add('lm-off'); return null; }

  function sh(type, src){
    var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  function prog(fs){
    var p = gl.createProgram();
    gl.attachShader(p, sh(gl.VERTEX_SHADER, VERT));
    gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
    gl.bindAttribLocation(p, 0, 'position');
    gl.linkProgram(p);
    if(!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    var u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for(var i=0;i<n;i++){ var info = gl.getActiveUniform(p,i);
      u[info.name.replace('[0]','')] = gl.getUniformLocation(p, info.name); }
    return {p:p, u:u};
  }
  var pScene, pRim, pDown, pBlur, pComp;
  try{
    pScene = prog(FRAG_SCENE); pRim = prog(FRAG_RIM);
    pDown  = prog(FRAG_DOWN);  pBlur = prog(FRAG_BLUR); pComp = prog(FRAG_COMP);
  }catch(err){ host.classList.add('lm-off'); return null; }

  var vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  var vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  var hasFloat = !!gl.getExtension('EXT_color_buffer_half_float');
  function makeTarget(){
    var tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    var fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    return {tex:tex, fbo:fbo, w:0, h:0};
  }
  function sizeTarget(t, w, h){
    if(t.w === w && t.h === h) return;
    t.w = w; t.h = h;
    gl.bindTexture(gl.TEXTURE_2D, t.tex);
    if(hasFloat) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
    else         gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8,   w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  }
  var T_core = makeTarget(), T_rim = makeTarget(),
      T_s1 = makeTarget(), T_s2 = makeTarget(),
      T_a = makeTarget(), T_b = makeTarget();

  var W=0, H=0, DPR=1, BW=0, BH=0, CX=0, CY=0, DOWN=4, GLOW_TEX=129, needResize=true;
  function resize(){
    var r  = cv.getBoundingClientRect();
    var br = btn.getBoundingClientRect();
    if(r.width < 2 || br.height < 2) return;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.max(2, Math.round(r.width  * DPR));
    var h = Math.max(2, Math.round(r.height * DPR));
    if(w !== W || h !== H){ W = w; H = h; cv.width = W; cv.height = H; }
    BW = br.width * DPR; BH = br.height * DPR;
    CX = (br.left - r.left) * DPR + BW/2;
    CY = H - ((br.top - r.top) * DPR + BH/2);
    sizeTarget(T_core, W, H); sizeTarget(T_rim, W, H);
    var hw = Math.max(2, Math.ceil(W/2)), hh = Math.max(2, Math.ceil(H/2));
    sizeTarget(T_s1, hw, hh); sizeTarget(T_s2, hw, hh);
    DOWN = Math.max(1, Math.min(4, Math.round(BH / GLOW_TEX)));
    var dw = Math.max(2, Math.ceil(W/DOWN)), dh = Math.max(2, Math.ceil(H/DOWN));
    sizeTarget(T_a, dw, dh); sizeTarget(T_b, dw, dh);
    needResize = false;
  }
  if(window.ResizeObserver) new ResizeObserver(function(){ needResize = true; }).observe(host);
  window.addEventListener('resize', function(){ needResize = true; });

  function drawTo(t){
    gl.bindFramebuffer(gl.FRAMEBUFFER, t ? t.fbo : null);
    gl.viewport(0, 0, t ? t.w : W, t ? t.h : H);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  var hover=0, hoverTarget=0, press=0, pressTarget=0, clock=0;
  var RIP = [{x:0,y:0,t:-99,on:0},{x:0,y:0,t:-99,on:0},{x:0,y:0,t:-99,on:0}];
  var ripArr = new Float32Array(12), ripNext = 0;
  var ptr = {x:0,y:0}, ptrS = {x:0,y:0}, ptrAmt = 0, ptrSpeed = 0;
  var on = {over:false, press:false, focus:false};
  var drawn = null, idle = 0;

  function addRipple(x, y){
    var r = RIP[ripNext]; ripNext = (ripNext + 1) % RIP.length;
    r.x = x; r.y = y; r.t = clock; r.on = 1;
  }
  function localPt(e){
    var b = btn.getBoundingClientRect(), s = b.height;
    return [(e.clientX - (b.left + b.width/2)) / s,
            (e.clientY - (b.top  + b.height/2)) / s];
  }
  function sync(){
    hoverTarget = (on.over || on.press || on.focus) ? 1 : 0;
    pressTarget = on.press ? 1 : 0;
    host.classList.toggle('is-hot', hoverTarget > 0.5);
    host.classList.toggle('is-press', on.press);
  }

  btn.addEventListener('pointerenter', function(e){
    if(e.pointerType !== 'mouse') return;
    var l = localPt(e); ptr.x = l[0]; ptr.y = l[1];
    ptrS.x = ptr.x; ptrS.y = ptr.y; ptrSpeed = 0;
    on.over = true; sync();
  });
  btn.addEventListener('pointerleave', function(e){
    if(e.pointerType === 'mouse'){ on.over = false; sync(); }
  });
  window.addEventListener('pointermove', function(e){
    if(!on.over && !on.press) return;
    var l = localPt(e); ptr.x = l[0]; ptr.y = l[1];
  }, {passive:true});
  btn.addEventListener('pointerdown', function(e){
    var l = localPt(e); ptr.x = l[0]; ptr.y = l[1];
    on.press = true; sync(); addRipple(ptr.x, ptr.y);
  });
  window.addEventListener('pointerup',     function(){ on.press = false; sync(); });
  window.addEventListener('pointercancel', function(){ on.press = false; sync(); });
  btn.addEventListener('focus', function(){ on.focus = btn.matches(':focus-visible'); sync(); });
  btn.addEventListener('blur',  function(){ on.focus = false; sync(); });
  btn.addEventListener('keydown', function(e){
    if((e.key !== 'Enter' && e.key !== ' ') || e.repeat) return;
    on.press = true; sync(); addRipple(0, 0);
  });
  btn.addEventListener('keyup', function(e){
    if(e.key !== 'Enter' && e.key !== ' ') return;
    on.press = false; sync();
  });

  resize();

  return function step(dt){
    if(!calm.matches) clock += dt;

    var k = hoverTarget > hover ? 1 - Math.pow(0.0012, dt) : 1 - Math.pow(0.00012, dt);
    hover += (hoverTarget - hover) * k;
    if(Math.abs(hoverTarget - hover) < 0.0008) hover = hoverTarget;

    var pk = pressTarget > press ? 1 - Math.pow(1e-9, dt) : 1 - Math.pow(0.004, dt);
    press += (pressTarget - press) * pk;
    if(Math.abs(pressTarget - press) < 0.002) press = pressTarget;

    var ripLive = false;
    for(var i = 0; i < RIP.length; i++){
      var r = RIP[i];
      if(r.on && clock - r.t > 4) r.on = 0;
      if(r.on) ripLive = true;
      ripArr[i*4] = r.x; ripArr[i*4+1] = r.y; ripArr[i*4+2] = r.t; ripArr[i*4+3] = r.on;
    }

    var lag = 1 - Math.pow(R.ptrLag, dt);
    var dx = (ptr.x - ptrS.x) * lag, dy = (ptr.y - ptrS.y) * lag;
    ptrS.x += dx; ptrS.y += dy;
    var inst = Math.min(Math.hypot(dx, dy) / Math.max(dt, 1e-3) / R.ptrVref, 1);
    ptrSpeed += (inst - ptrSpeed) * (1 - Math.pow(inst > ptrSpeed ? 0.001 : 0.02, dt));
    var wantWell = (on.over || on.press) ? 1 : 0;
    ptrAmt += (wantWell - ptrAmt) * (1 - Math.pow(0.004, dt));
    if(Math.abs(wantWell - ptrAmt) < 0.002) ptrAmt = wantWell;

    if(needResize) resize();
    if(!W || !H) return;

    var busy = hover > 0.002 || press > 0.002 || ripLive || ptrAmt > 0.002;
    idle += dt;
    if(!busy && idle < 0.033) return;
    idle = 0;

    var sig = (calm.matches && !ripLive && ptrAmt < 0.002)
      ? (hover + '|' + press + '|' + W + '|' + H) : null;
    if(sig !== null && sig === drawn) return;
    drawn = sig;

    for(var a = 0; a < uArr.length; a++) uArr[a] = P[PKEYS[a]];
    for(var b = 0; b < eArr.length; b++) eArr[b] = E[EKEYS[b]];
    var bw = Math.max(1.5, 3.2 * (BH/516));

    gl.bindVertexArray(vao);
    gl.useProgram(pScene.p);
    gl.uniform2f(pScene.u.uC, CX, CY);
    gl.uniform2f(pScene.u.uHalf, BW/2, BH/2);
    gl.uniform1f(pScene.u.uT, clock);
    gl.uniform1f(pScene.u.uHover, hover);
    gl.uniform1f(pScene.u.uPress, press);
    gl.uniform4fv(pScene.u.uRip, ripArr);
    gl.uniform4f(pScene.u.uRipK, R.speed, R.width, R.decay, R.amp);
    gl.uniform4f(pScene.u.uRipK2, R.facet, R.lobes, R.sharp, R.emit);
    gl.uniform4f(pScene.u.uPtr, ptrS.x, ptrS.y, ptrAmt, ptrSpeed);
    gl.uniform4f(pScene.u.uPtrK, R.ptrRad, R.ptrAmp, R.ptrFast, R.ptrRim);
    gl.uniform1fv(pScene.u.uP, uArr);
    drawTo(T_core);

    gl.useProgram(pRim.p);
    gl.uniform2f(pRim.u.uC, CX, CY);
    gl.uniform2f(pRim.u.uHalf, BW/2, BH/2);
    gl.uniform1f(pRim.u.uT, clock);
    gl.uniform1f(pRim.u.uBw, bw);
    gl.uniform1f(pRim.u.uPress, press);
    gl.uniform4fv(pRim.u.uRip, ripArr);
    gl.uniform4f(pRim.u.uRipK, R.speed, R.width, R.decay, R.amp);
    gl.uniform4f(pRim.u.uRipK2, R.facet, R.lobes, R.sharp, R.emit);
    gl.uniform4f(pRim.u.uPtr, ptrS.x, ptrS.y, ptrAmt, ptrSpeed);
    gl.uniform4f(pRim.u.uPtrK, R.ptrRad, R.ptrAmp, R.ptrFast, R.ptrRim);
    gl.uniform1fv(pRim.u.uE, eArr);
    drawTo(T_rim);

    gl.useProgram(pDown.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, T_core.tex);
    gl.uniform1i(pDown.u.uTex, 0);
    gl.uniform1f(pDown.u.uAdd, 0);
    gl.uniform2f(pDown.u.uDstTexel, 1/T_s1.w, 1/T_s1.h);
    drawTo(T_s1);

    gl.useProgram(pBlur.p);
    gl.uniform1i(pBlur.u.uTex, 0);
    gl.uniform2f(pBlur.u.uTexel, 1/T_s1.w, 1/T_s1.h);
    var sigTex = C.soften * (BH * 0.5) * 0.95;
    if(sigTex > 0.1 && (hover > 0.002 || ripLive || ptrAmt > 0.002)){
      var iters = Math.min(4, Math.max(1, Math.ceil(sigTex / 3.0)));
      gl.uniform1f(pBlur.u.uR, sigTex / Math.sqrt(iters) / 1.95);
      for(var it = 0; it < iters; it++){
        gl.bindTexture(gl.TEXTURE_2D, T_s1.tex); gl.uniform2f(pBlur.u.uDir, 1, 0); drawTo(T_s2);
        gl.bindTexture(gl.TEXTURE_2D, T_s2.tex); gl.uniform2f(pBlur.u.uDir, 0, 1); drawTo(T_s1);
      }
    }

    gl.useProgram(pDown.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, T_s1.tex);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, T_rim.tex);
    gl.uniform1i(pDown.u.uTex, 0);
    gl.uniform1i(pDown.u.uTex2, 1);
    gl.uniform1f(pDown.u.uAdd, 1);
    gl.uniform2f(pDown.u.uDstTexel, 1/T_a.w, 1/T_a.h);
    drawTo(T_a);

    gl.useProgram(pBlur.p);
    gl.activeTexture(gl.TEXTURE0);
    gl.uniform1i(pBlur.u.uTex, 0);
    gl.uniform2f(pBlur.u.uTexel, 1/T_a.w, 1/T_a.h);
    var rs = C.glowR * (BH / DOWN) / GLOW_TEX, RADII = [1.0, 2.3, 5.2, 9.0];
    for(var q = 0; q < RADII.length; q++){
      gl.uniform1f(pBlur.u.uR, RADII[q] * rs);
      gl.bindTexture(gl.TEXTURE_2D, T_a.tex); gl.uniform2f(pBlur.u.uDir, 1, 0); drawTo(T_b);
      gl.bindTexture(gl.TEXTURE_2D, T_b.tex); gl.uniform2f(pBlur.u.uDir, 0, 1); drawTo(T_a);
    }

    gl.useProgram(pComp.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, T_s1.tex);  gl.uniform1i(pComp.u.uSoft, 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, T_rim.tex); gl.uniform1i(pComp.u.uRim, 1);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, T_a.tex);   gl.uniform1i(pComp.u.uGlow, 2);
    gl.uniform2f(pComp.u.uRes, W, H);
    gl.uniform2f(pComp.u.uC, CX, CY);
    gl.uniform2f(pComp.u.uHalf, BW/2, BH/2);
    gl.uniform1f(pComp.u.uT, clock);
    gl.uniform4fv(pComp.u.uRip, ripArr);
    gl.uniform4f(pComp.u.uRipK, R.speed, R.width, R.decay, R.amp);
    gl.uniform4f(pComp.u.uRipK2, R.facet, R.lobes, R.sharp, R.emit);
    gl.uniform1f(pComp.u.uGlowGain, C.glow);
    gl.uniform1f(pComp.u.uGlowIn, C.glowIn);
    gl.uniform1f(pComp.u.uOccl, C.occl);
    gl.uniform1f(pComp.u.uDim, P.dim);
    gl.uniform1f(pComp.u.uPunch, C.punch);
    drawTo(null);
  };
}

var steps = [];
for(var i = 0; i < hosts.length; i++){
  var s = build(hosts[i]);
  if(s) steps.push(s);
}
if(!steps.length) return;

var last = performance.now();
(function loop(now){
  requestAnimationFrame(loop);
  var dt = Math.min((now - last) / 1000, 1/20); last = now;
  for(var i = 0; i < steps.length; i++) steps[i](dt);
})(last);
})();
</script>
</body>
</html>
