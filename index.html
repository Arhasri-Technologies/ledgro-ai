<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ledgro AI</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c1110;
      --ink: #f4f7f4;
      --muted: #9aa89f;
      --line: #24302b;
      --accent: #7dffb3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--ink);
    }
    main {
      width: min(36rem, calc(100% - 2.5rem));
      padding-bottom: 8vh;
    }
    p {
      margin: 0;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.75rem;
      color: var(--accent);
    }
    h1 {
      margin: 0.75rem 0 0;
      font-size: clamp(3rem, 8vw, 5rem);
      font-weight: 500;
      letter-spacing: -0.03em;
    }
    .line {
      margin-top: 1.5rem;
      width: 4rem;
      border-top: 1px solid var(--line);
    }
    .note {
      margin-top: 1.25rem;
      letter-spacing: 0;
      text-transform: none;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 1rem;
      line-height: 1.5;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <p>Ledgro</p>
    <h1>Ledgro AI</h1>
    <div class="line"></div>
    <p class="note">Basic page. Project is ready.</p>
  </main>
</body>
</html>
